[project]
name = "campus-overflow-ai-backend"
version = "0.1.0"
description = "CampusOverflow AI 业务后端：FastAPI + SQLAlchemy + MySQL"
requires-python = ">=3.11"
dependencies = [
    # Web 框架与服务器
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # 数据库（第一阶段使用同步 SQLAlchemy + PyMySQL，稳定优先；
    # 如后续切 async，再替换为 asyncmy/aiomysql + async session）
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "cryptography>=42.0",          # PyMySQL 连接 MySQL 8 认证所需
    # 配置与校验
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.0",        # Pydantic EmailStr 所需
    # 认证与安全
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",     # 表单/文件上传
    "bleach>=6.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",                 # FastAPI TestClient 依赖
    "ruff>=0.4",
    "import-linter>=2.0",          # 架构适应度函数：分层与依赖契约（分层架构设计基线 D-6）
]
redis = [
    "redis>=5.0",                  # 可选增强：AI 限流、缓存、排行榜；第一阶段不作为必需启动项
]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# Alembic autogenerate 产物不做格式检查（行长/导入序由生成器决定）
[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001", "W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# 架构适应度函数（docs/后端架构/分层架构设计基线.md D-6）：CI 与本地运行 uv run lint-imports
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain 层零框架依赖"
type = "forbidden"
source_modules = [
    "app.modules.identity.domain",
    "app.modules.courses.domain",
    "app.modules.qa.domain",
    "app.modules.interaction.domain",
]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic", "pydantic_settings"]

[[tool.importlinter.contracts]]
name = "service/router 层不得触碰任何 ORM models"
type = "forbidden"
source_modules = [
    "app.modules.identity.service",
    "app.modules.identity.router",
    "app.modules.courses.service",
    "app.modules.courses.router",
    "app.modules.qa.service",
    "app.modules.qa.router",
    "app.modules.interaction.service",
    "app.modules.interaction.router",
    "app.modules.governance.router",
]
forbidden_modules = [
    "app.modules.identity.models",
    "app.modules.courses.models",
    "app.modules.qa.models",
    "app.modules.interaction.models",
    "app.modules.governance.models",
]
# 合法中转边（剪掉后传递链不再误报，直连仍会被抓）：
# 1) repository 是唯一允许 import models 的层（分层基线 D-2）；
# 2) core.permissions 为接口层依赖注入，内部读取 identity.models 完成鉴权后
#    对外只输出轻量 UserPrincipal（分层基线 D-9），属文档化豁免。
# 注意：T-03+ 新模块实现 repository 后，必须在此补充对应的 "x.repository -> x.models" 行；
# governance.service 与 discovery.service 落地时分别补进 source_modules（discovery 允许读
# qa/courses 的 models，届时在此补对应 ignore_imports）。
ignore_imports = [
    "app.modules.identity.repository -> app.modules.identity.models",
    "app.modules.courses.repository -> app.modules.courses.models",
    "app.modules.qa.repository -> app.modules.qa.models",
    # interaction 是"内容的衍生写"模块（架构说明第 3 节依赖 qa、identity）：
    # 投票目标与公开内容计数读 qa.models，总分与榜单用户名读 identity.models
    "app.modules.interaction.repository -> app.modules.interaction.models",
    "app.modules.interaction.repository -> app.modules.qa.models",
    "app.modules.interaction.repository -> app.modules.identity.models",
    "app.core.permissions -> app.modules.identity.models",
]

[[tool.importlinter.contracts]]
name = "service/repository 层不依赖 Web 框架"
type = "forbidden"
source_modules = [
    "app.modules.identity.service",
    "app.modules.identity.repository",
    "app.modules.courses.service",
    "app.modules.courses.repository",
    "app.modules.qa.service",
    "app.modules.qa.repository",
    "app.modules.interaction.service",
    "app.modules.interaction.repository",
]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "core 不得 import 任何 modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]
# 唯一豁免（分层基线 D-9）：core.permissions 内部读取 identity.models 完成鉴权、
# 复用 identity.domain 的能力位判定规则，对外只输出 UserPrincipal，ORM 不泄漏到 router。
ignore_imports = [
    "app.core.permissions -> app.modules.identity.models",
    "app.core.permissions -> app.modules.identity.domain",
]
