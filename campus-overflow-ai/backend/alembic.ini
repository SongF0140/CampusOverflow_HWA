# Alembic config: sqlalchemy.url is injected at runtime by env.py (BACKEND_DATABASE_URL).
# Keep this file ASCII-only: alembic reads it with locale encoding (GBK on Windows).
[alembic]
script_location = alembic
prepend_sys_path = .
# placeholder url; the real one comes from settings.database_url in env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
