# CampusOverflow AI 生产统一入口（T-18 v4，见 specs/plan.md §9.2）
# 挂载位置：/etc/nginx/conf.d/default.conf（覆盖镜像自带默认站点）
#
# 路由口径以前端 BFF 为准（docs/前端架构/前端服务需求文档.md §1/§4.3）：
#   浏览器只调同源地址，/api/backend/** 与 /api/agent/** 全部交给前端，
#   由 Next Route Handler 注入登录态与 x-trace-id。
# 因此这里只有 "全部转 frontend" 一条规则——不存在 /api/ -> backend 的直连。

upstream campus_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # 治理内部接口绝不对外（宪法 C-05：只允许 Agent 服务经内网访问 FastAPI）
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://campus_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式响应必须关缓冲，否则 BFF 事件流会被攒批（plan 风险 T-04）
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
