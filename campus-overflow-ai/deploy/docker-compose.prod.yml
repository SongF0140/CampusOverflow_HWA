# 生产形态（T-18 v4，2026-10-14）：MySQL + backend + agent + frontend + nginx。
# 用法（在 campus-overflow-ai/ 下执行）：
#   cp deploy/.env.example deploy/.env && vi deploy/.env   # 必须覆盖 change-me 项
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# 说明：
#   1) compose 的项目目录 = compose 文件所在目录（deploy/），因此 .env 放 deploy/；
#   2) 后端启动时自动 alembic upgrade head，无需手工迁移；
#   3) 只有 nginx:80 对公网开放，frontend/backend/agent 仅回环或内网；
#   4) 资源约束（1.9 GiB 内存）见 specs/plan.md §9.3。
name: campus-overflow

services:
  mysql:
    image: mysql:8.4
    environment:
      # 敏感项不给默认值：.env 未配置则 compose 直接报错，避免弱口令上线
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_overflow}
      TZ: Asia/Shanghai
    # innodb_buffer_pool_size 显式限制：服务器仅 1.9 GiB 内存（plan §9.3）
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    environment:
      BACKEND_DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-campus_overflow}?charset=utf8mb4
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:?请在 deploy/.env 设置 BACKEND_JWT_SECRET}
      # 服务间 token：与 agent.AGENT_SERVICE_TOKEN 取同一变量，保证一致（T-12 验收口径）
      BACKEND_AGENT_SERVICE_TOKEN: ${BACKEND_AGENT_SERVICE_TOKEN:?请在 deploy/.env 设置 BACKEND_AGENT_SERVICE_TOKEN}
      BACKEND_DEBUG: "false"
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
    # 仅回环开放，供宿主机排障；公网入口只有 nginx
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  agent:
    build:
      context: ../agent
      dockerfile: ../deploy/agent.Dockerfile
    environment:
      # 服务间地址与凭证由内网 DNS 解析，不经公网
      BACKEND_BASE_URL: http://backend:8000
      AGENT_SERVICE_TOKEN: ${BACKEND_AGENT_SERVICE_TOKEN:?请在 deploy/.env 设置 BACKEND_AGENT_SERVICE_TOKEN}
      AGENT_PORT: "8787"
      # 本次 release 已停用 AI 端点，以下留空即可正常运行；
      # baseURL 必须兜底成合法值：空串会在 @ai-sdk/openai 模块加载期直接抛断言（A-43）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AGENT_MODEL_ID: ${AGENT_MODEL_ID:-gpt-4o-mini}
    # 不对宿主机发布端口：仅内网供 frontend BFF 与 backend 访问
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    environment:
      NODE_ENV: "production"
      # Docker 默认把 HOSTNAME 设成容器 id，Next standalone 会拿它当监听地址，
      # 结果只绑到 eth0 IP（172.18.x.x:3000），容器内 localhost:3000 连不上 →
      # 健康检查恒失败、nginx 解析不到可用上游（A-44）
      HOSTNAME: "0.0.0.0"
      # BFF 与 /api/health 聚合的下游地址（容器内网 DNS）
      BACKEND_ORIGIN: http://backend:8000
      AGENT_ORIGIN: http://agent:8787
    # 仅回环开放，供宿主机排障；公网入口只有 nginx
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      # /api/health 恒返 200（下游降级不判失败），用于判断前端进程本身存活
      test: ["CMD", "node", "-e",
             "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql-data:
